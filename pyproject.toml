[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supply-chain-intelligence"
version = "0.1.0"
description = "AI powered supply chain risk investigation system"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "pandas",
    "numpy",
    "scikit-learn==1.6.1",
    "joblib",
    "requests",
    "httpx",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-openai",
    "langchain-chroma",
    "chromadb",
    "pypdf",
    "docx2txt",
    "pydantic-settings",
    "xgboost==3.1.1",
    "langgraph==1.2.12",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "rag"]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external services or persisted integration assets",
]
